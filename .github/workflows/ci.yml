name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Contract checks
        run: npm run verify:contracts

      - name: Competition archive filter checks
        run: npm run verify:competition-filters

      - name: Gallery archive filter checks
        run: npm run verify:gallery

      - name: Homepage responsive layout checks
        run: node scripts/verify-homepage-responsive.mjs

      - name: Public accessibility and metadata checks
        run: node scripts/verify-public-quality.mjs

      - name: Robot archive regression checks
        run: node scripts/verify-robot-archive.mjs

      - name: Private engineering portal access checks
        run: node scripts/verify-engineering-portal.mjs

      - name: Engineering project/task access checks
        run: npm run verify:engineering-projects

      - name: Private engineering design contract checks
        run: node scripts/verify-engineering-design.mjs

      - name: Production build
        run: npm run build

      - name: Production HTTP smoke checks
        run: npm run verify:smoke
